<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --bg:#0d0d0f;--surface:#141418;--card:#1a1a21;--border:#2a2a35;
    --accent:#c8f000;--text:#f0f0f5;--text2:#8888a0;
    --good:#4ade80;--danger:#ff4d4d;--warm:#ff8c42;--cool:#4db8ff;
    --lunes:#c8f000;--martes:#4db8ff;--miercoles:#ff8c42;
    --jueves:#c8f000;--viernes:#b06ef3;--day-color:#c8f000;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;}

  /* ── HEADER ── */
  .header{padding:16px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;background:var(--bg);}
  .header-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;letter-spacing:-0.02em;line-height:1;text-transform:uppercase;}
  .header-title span{color:var(--accent);}
  .header-sub{font-size:0.7rem;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

  /* unit toggle */
  .unit-toggle{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  .unit-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.72rem;letter-spacing:0.06em;padding:5px 10px;border:none;background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
  .unit-btn.active{background:var(--accent);color:#000;}

  /* nav icons */
  .nav-icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:1rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
  .nav-icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ── TABS ── */
  .days-scroll{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);}
  .days-scroll::-webkit-scrollbar{display:none;}
  .day-tab{flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.78rem;letter-spacing:0.07em;text-transform:uppercase;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .day-tab .day-name{font-size:0.65rem;opacity:.7;}
  .day-tab.active{border-color:var(--day-color,var(--accent));color:var(--day-color,var(--accent));background:color-mix(in srgb,var(--day-color,var(--accent)) 10%,transparent);}
  .day-tab.today-mark::after{content:'•';font-size:.55rem;color:var(--accent);line-height:1;}

  /* ── PROGRESS ── */
  .session-progress{padding:8px 16px 4px;display:flex;align-items:center;gap:10px;}
  .prog-bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
  .prog-bar-fill{height:100%;background:var(--day-color,var(--accent));border-radius:2px;transition:width .3s;width:0%;}
  .prog-pct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.78rem;color:var(--day-color,var(--accent));min-width:32px;text-align:right;}

  /* ── MAIN ── */
  .main{padding:12px 16px;}
  .session-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .session-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.8rem;text-transform:uppercase;letter-spacing:-0.01em;line-height:1;}
  .session-title .day-accent{color:var(--day-color,var(--accent));}
  .session-badge{font-size:0.7rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--day-color,var(--accent));color:var(--day-color,var(--accent));}

  /* ── PHASE ── */
  .phase{margin-bottom:10px;border-radius:12px;border:1px solid var(--border);background:var(--card);overflow:hidden;}
  .phase-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;}
  .phase-icon{font-size:1rem;}
  .phase-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.83rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);flex:1;}
  .phase-chevron{font-size:.65rem;color:var(--text2);transition:transform .2s;}
  .phase.open .phase-chevron{transform:rotate(180deg);}
  .phase-body{display:none;padding:0 14px 14px;}
  .phase.open .phase-body{display:block;}

  /* warmup */
  .warmup-list{display:flex;flex-wrap:wrap;gap:6px;}
  .warmup-item{font-size:.77rem;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;user-select:none;}
  .warmup-item.done{background:rgba(200,240,0,.1);border-color:var(--accent);color:var(--accent);text-decoration:line-through;opacity:.75;}

  /* exercise card */
  .exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .exercise-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;}
  .ex-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.2rem;color:var(--day-color,var(--accent));min-width:22px;line-height:1;}
  .ex-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.03em;flex:1;line-height:1.2;}
  .ex-status{font-size:.67rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:12px;border:1px solid var(--border);color:var(--text2);white-space:nowrap;}
  .ex-status.complete{border-color:var(--good);color:var(--good);background:rgba(74,222,128,.08);}
  .ex-chevron{font-size:.65rem;color:var(--text2);transition:transform .2s;}
  .exercise-card.open .ex-chevron{transform:rotate(180deg);}
  .exercise-body{display:none;padding:0 12px 12px;}
  .exercise-card.open .exercise-body{display:block;}

  /* sets */
  .sets-grid{display:grid;grid-template-columns:28px 1fr 1fr 76px;gap:4px;align-items:center;}
  .sets-label{font-size:.6rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);padding:4px 0;text-align:center;}
  .sets-label:first-child{text-align:left;}
  .set-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;color:var(--text2);text-align:center;padding:6px 0;}
  .set-input{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:600;padding:6px 6px;width:100%;text-align:center;-webkit-appearance:none;transition:border-color .15s;}
  .set-input:focus{outline:none;border-color:var(--day-color,var(--accent));}
  .set-input::placeholder{color:var(--text2);opacity:.45;}
  .set-done-btn{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.72rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;padding:6px 4px;cursor:pointer;text-align:center;transition:all .15s;width:100%;}
  .set-done-btn.done{background:rgba(74,222,128,.12);border-color:var(--good);color:var(--good);}
  .add-set-btn{margin-top:8px;width:100%;background:transparent;border:1px dashed var(--border);border-radius:6px;color:var(--text2);font-size:.73rem;font-family:'Barlow',sans-serif;padding:6px;cursor:pointer;transition:all .15s;}
  .add-set-btn:hover{border-color:var(--day-color,var(--accent));color:var(--day-color,var(--accent));}
  .ex-best{font-size:.72rem;color:var(--text2);margin:6px 0 8px;display:flex;align-items:center;gap:6px;}
  .ex-best .best-val{color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;}
  .ex-notes{margin-top:8px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.77rem;font-family:'Barlow',sans-serif;padding:6px 8px;resize:none;min-height:38px;transition:border-color .15s;}
  .ex-notes:focus{outline:none;border-color:var(--day-color,var(--accent));color:var(--text);}
  .ex-notes::placeholder{opacity:.4;}

  /* history */
  .history-section{margin-top:8px;}
  .history-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .history-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .history-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;}
  .history-entry{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);}
  .history-date{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.7rem;color:var(--text2);min-width:48px;}
  .history-sets{flex:1;display:flex;flex-wrap:wrap;gap:4px;}
  .history-set{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--text);}
  .history-set.pr{background:rgba(200,240,0,.15);color:var(--accent);}
  .history-list::-webkit-scrollbar{width:3px;}
  .history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

  /* save btn */
  .save-session-wrap{padding:12px 16px 0;}
  .save-session-btn{width:100%;background:var(--day-color,var(--accent));color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;padding:13px;border:none;border-radius:10px;cursor:pointer;transition:opacity .15s;}
  .save-session-btn:hover{opacity:.88;}

  /* ── MODAL (reporte) ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;overflow:hidden;margin:auto;}
  .modal-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;text-transform:uppercase;letter-spacing:-.01em;}
  .modal-title span{color:var(--accent);}
  .modal-close{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:1rem;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-body{padding:16px 18px;}

  /* week picker */
  .week-picker{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .wpick-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.9rem;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .wpick-btn:hover{border-color:var(--accent);color:var(--accent);}
  .wpick-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;color:var(--text);flex:1;text-align:center;letter-spacing:.04em;}

  /* summary boxes */
  .summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .summary-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;}
  .summary-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;color:var(--accent);line-height:1;}
  .summary-lbl{font-size:.65rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-top:2px;}

  /* day rows */
  .report-day{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .report-day-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;}
  .report-day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .report-day-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;text-transform:uppercase;flex:1;}
  .report-day-badge{font-size:.68rem;font-family:'Barlow Condensed',sans-serif;font-weight:600;padding:3px 8px;border-radius:12px;}
  .badge-done{background:rgba(74,222,128,.12);color:var(--good);border:1px solid var(--good);}
  .badge-miss{background:rgba(255,77,77,.08);color:var(--danger);border:1px solid rgba(255,77,77,.3);}
  .report-day-body{display:none;padding:0 12px 12px;}
  .report-day.open .report-day-body{display:block;}
  .report-ex-row{padding:6px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  .report-ex-row:last-child{border-bottom:none;}
  .report-ex-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.88rem;text-transform:uppercase;color:var(--text);}
  .report-sets-wrap{display:flex;flex-wrap:wrap;gap:4px;}
  .report-set-chip{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.78rem;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--text2);}
  .report-set-chip.pr{background:rgba(200,240,0,.15);color:var(--accent);}

  /* export buttons */
  .export-row{display:flex;gap:8px;margin-top:16px;}
  .export-btn{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:11px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s;}
  .export-btn:hover{opacity:.85;}
  .btn-json{background:var(--accent);color:#000;}
  .btn-import{background:var(--surface);color:var(--text2);border:1px solid var(--border);}
  .import-hidden{display:none;}

  /* toast */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:30px;z-index:300;transition:transform .3s;pointer-events:none;}
  .toast.show{transform:translateX(-50%) translateY(0);}

  @media(min-width:480px){.main,.save-session-wrap{padding-left:20px;padding-right:20px;}.header,.days-scroll,.session-progress{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-title">Gym<span>Tracker</span></div>
    <div class="header-sub">Semana <span id="weekNum">—</span> · 5 días</div>
  </div>
  <div class="header-right">
    <div class="unit-toggle">
      <button class="unit-btn active" id="btnKg" onclick="setUnit('kg')">kg</button>
      <button class="unit-btn" id="btnLbs" onclick="setUnit('lbs')">lbs</button>
    </div>
    <button class="nav-icon-btn" title="Reporte semanal" onclick="openReport()">📊</button>
  </div>
</header>

<div class="days-scroll" id="daysTabs"></div>

<div class="session-progress">
  <div class="prog-bar-wrap"><div class="prog-bar-fill" id="progFill"></div></div>
  <div class="prog-pct" id="progPct">0%</div>
</div>

<div class="main" id="mainContent"></div>

<div class="save-session-wrap">
  <button class="save-session-btn" onclick="saveSession()">💾 Guardar sesión</button>
</div>

<!-- REPORT MODAL -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Reporte <span>Semanal</span></div>
      <button class="modal-close" onclick="closeReport()">✕</button>
    </div>
    <div class="modal-body">
      <div class="week-picker">
        <button class="wpick-btn" onclick="shiftReportWeek(-1)">◀</button>
        <div class="wpick-label" id="reportWeekLabel">—</div>
        <button class="wpick-btn" onclick="shiftReportWeek(1)">▶</button>
      </div>
      <div class="summary-grid" id="reportSummary"></div>
      <div id="reportDays"></div>
      <div class="export-row">
        <button class="export-btn btn-json" onclick="exportJSON()">⬇ Exportar JSON</button>
        <button class="export-btn btn-import" onclick="document.getElementById('importFile').click()">⬆ Importar JSON</button>
      </div>
      <input type="file" id="importFile" class="import-hidden" accept=".json" onchange="importJSON(this)">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════
const DAYS = [
  {id:"lunes",label:"Lun",name:"Lunes",muscle:"Pierna",color:"var(--lunes)",
   warmup:["Bicicleta 5min","Sentadilla aire ×20","Rodilla al pecho","Cuádriceps de pie","Glúteo bilateral","Movilidad cadera","Peso corporal ×10"],
   exercises:[
     {name:"Prensa",sets:4,reps:10},{name:"Pantorrilla",sets:4,reps:15},
     {name:"Cuádricep",sets:3,reps:12},{name:"Femoral",sets:3,reps:12},
     {name:"Abdomen",sets:3,reps:20},{name:"Hombro lateral",sets:3,reps:12},
     {name:"Hombro posterior",sets:3,reps:12}],
   stretch:["Cuádricep de pie","Femoral sentado","Pantorrilla pared","Cadera paloma","Glúteo cruzado","Isquio pie","Hombro cruzado"]},

  {id:"martes",label:"Mar",name:"Martes",muscle:"Espalda",color:"var(--martes)",
   warmup:["Cardio 5min","Rotación hombros","Peso muerto aire ×15","Jalón polea ligera ×15","Apertura pecho","Movilidad escápulas","Banda lateral ×10"],
   exercises:[
     {name:"Jalón al pecho",sets:4,reps:10},{name:"Remo polea",sets:4,reps:10},
     {name:"Remo en T",sets:3,reps:10},{name:"Curl martillo",sets:3,reps:12},
     {name:"Predicador",sets:3,reps:12}],
   stretch:["Hombro cruzado","Espalda alta pared","Lat dobladillo","Bícep pared","Trapecio lateral","Columna gato-vaca","Pecho abierto"]},

  {id:"miercoles",label:"Mié",name:"Miércoles",muscle:"Pecho",color:"var(--miercoles)",
   warmup:["Cardio 5min","Círculo de brazos","Flexión lenta ×10","Apertura hombro suave","Rotación externa","Pecho suave banda","Push-up suave ×10"],
   exercises:[
     {name:"Press inclinado",sets:4,reps:10},{name:"Press plano",sets:4,reps:10},
     {name:"Aperturas",sets:3,reps:12},{name:"Tríceps en polea",sets:3,reps:12},
     {name:"Trícep katana",sets:3,reps:12},{name:"Press militar",sets:3,reps:10},
     {name:"Laterales",sets:3,reps:15},{name:"Hombro posterior",sets:3,reps:15}],
   stretch:["Pecho puerta","Hombro cruzado","Trícep overhead","Pecho inclinado","Trapecio lateral","Bícep pared","Cuello lateral"]},

  {id:"jueves",label:"Jue",name:"Jueves",muscle:"Pierna",color:"var(--jueves)",
   warmup:["Bicicleta 5min","Sentadilla aire ×20","Movilidad cadera","Glúteo cuadrupedia","Puente glúteo ×15","Rodilla al pecho","Tobillo circular"],
   exercises:[
     {name:"Prensa",sets:4,reps:10},{name:"Pantorrilla",sets:4,reps:15},
     {name:"Cuádricep",sets:3,reps:12},{name:"Femoral",sets:3,reps:12},
     {name:"Abdomen",sets:3,reps:20},{name:"Hombro lateral",sets:3,reps:12}],
   stretch:["Cuádricep de pie","Femoral sentado","Pantorrilla pared","Cadera paloma","Glúteo cruzado","Isquio pie","Hombro cruzado"]},

  {id:"viernes",label:"Vie",name:"Viernes",muscle:"Pecho + Espalda",color:"var(--viernes)",
   warmup:["Cardio 5min","Push-up suave ×10","Jalón suave ×12","Rotación hombros","Apertura pecho","Movilidad escápulas","Core ×15"],
   exercises:[
     {name:"Press plano",sets:4,reps:10},{name:"Press inclinado",sets:4,reps:10},
     {name:"Jalón al pecho",sets:4,reps:10},{name:"Remo polea",sets:4,reps:10},
     {name:"Press militar",sets:3,reps:10},{name:"Laterales",sets:3,reps:15},
     {name:"Tríceps en polea",sets:3,reps:12},{name:"Trícep katana",sets:3,reps:12},
     {name:"Curl martillo",sets:3,reps:12},{name:"Predicador",sets:3,reps:12},
     {name:"Hombro posterior",sets:3,reps:15}],
   stretch:["Pecho puerta","Lat dobladillo","Hombro cruzado","Trícep overhead","Bícep pared","Espalda alta pared","Columna gato-vaca"]}
];

// resolve CSS var colors for dots
const DAY_HEX = {"var(--lunes)":"#c8f000","var(--martes)":"#4db8ff","var(--miercoles)":"#ff8c42","var(--jueves)":"#c8f000","var(--viernes)":"#b06ef3"};

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const STORAGE_KEY = "gymtracker_v4";
let state = {activeDay:0, unit:"kg", sessions:{}};

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)state={...state,...JSON.parse(s)};}catch(e){}
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}

function todayISO(){return new Date().toISOString().split("T")[0];}
function todayKey(dayId){return `${dayId}_${todayISO()}`;}

function getWeekNum(date){
  const d=date||new Date();
  const start=new Date(d.getFullYear(),0,1);
  return Math.ceil(((d-start)/86400000+start.getDay()+1)/7);
}

// Monday of a given ISO date string
function mondayOf(isoDate){
  const d=new Date(isoDate+"T12:00:00");
  const day=d.getDay()||7;
  d.setDate(d.getDate()-day+1);
  return d.toISOString().split("T")[0];
}

function getDaySession(dayId){
  const key=todayKey(dayId);
  if(!state.sessions[key]) state.sessions[key]={exercises:{},warmup:[],stretch:[],date:todayISO()};
  return state.sessions[key];
}

function getHistory(dayId,exName){
  return Object.entries(state.sessions)
    .filter(([k])=>k.startsWith(dayId+"_"))
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([key,sess])=>({date:key.replace(dayId+"_",""),sets:sess.exercises?.[exName]||[]}))
    .filter(h=>h.sets.length>0)
    .slice(-6);
}

function getBestKg(dayId,exName){
  let best=0;
  getHistory(dayId,exName).forEach(h=>h.sets.forEach(s=>{const v=toKg(parseFloat(s.kg)||0);if(v>best)best=v;}));
  return best;
}

// unit helpers
function toKg(v){return state.unit==="lbs"?+(v/2.2046).toFixed(2):v;}
function fromKg(v){return state.unit==="lbs"?+(v*2.2046).toFixed(1):v;}
function unitLabel(){return state.unit==="lbs"?"lbs":"kg";}

// ══════════════════════════════════════════════
//  RENDER TRACKER
// ══════════════════════════════════════════════
function todayDayIndex(){const m={1:0,2:1,3:2,4:3,5:4};return m[new Date().getDay()]??0;}

function renderDayTabs(){
  const wrap=document.getElementById("daysTabs");
  const ti=todayDayIndex();
  wrap.innerHTML=DAYS.map((d,i)=>`
    <button class="day-tab ${i===state.activeDay?"active":""} ${i===ti?"today-mark":""}"
      style="--day-color:${d.color}" onclick="setDay(${i})">
      <span>${d.label}</span><span class="day-name">${d.muscle.split(" ")[0]}</span>
    </button>`).join("");
}

function renderMain(){
  const day=DAYS[state.activeDay];
  const sess=getDaySession(day.id);
  document.documentElement.style.setProperty("--day-color",day.color);
  // progress
  const done=day.exercises.filter(ex=>(sess.exercises[ex.name]||[]).some(s=>s.done)).length;
  const pct=Math.round(done/day.exercises.length*100);
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progPct").textContent=pct+"%";
  // unit buttons
  document.getElementById("btnKg").classList.toggle("active",state.unit==="kg");
  document.getElementById("btnLbs").classList.toggle("active",state.unit==="lbs");

  document.getElementById("mainContent").innerHTML=`
    <div class="session-header">
      <div><div class="session-title"><span class="day-accent">${day.name}</span> · ${day.muscle}</div></div>
      <div class="session-badge">${day.exercises.length} ejercicios</div>
    </div>
    ${renderPhase("🔥","Calentamiento",day.warmup,"warmup",sess,day.id)}
    ${renderExercisesPhase(day,sess)}
    ${renderPhase("🧘","Estiramiento",day.stretch,"stretch",sess,day.id)}
  `;

  // open first card
  setTimeout(()=>{
    const first=document.getElementById(`ex_${day.id}_0`);
    if(first&&!first.classList.contains("open"))first.classList.add("open");
  },40);
}

function renderPhase(icon,title,items,type,sess,dayId){
  const done=sess[type]||[];
  return `<div class="phase open" id="phase_${type}">
    <div class="phase-header" onclick="togglePhase('${type}')">
      <span class="phase-icon">${icon}</span>
      <span class="phase-title">${title}</span>
      <span class="phase-chevron">▼</span>
    </div>
    <div class="phase-body">
      <div class="warmup-list">
        ${items.map((item,i)=>`
          <div class="warmup-item ${done.includes(i)?"done":""}"
            onclick="toggleWarmup('${dayId}','${type}',${i},this)">
            ${done.includes(i)?"✓ ":""}${item}
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function renderExercisesPhase(day,sess){
  const cards=day.exercises.map((ex,idx)=>{
    const raw=sess.exercises[ex.name]||Array.from({length:ex.sets},()=>({kg:"",reps:"",done:false}));
    const hist=getHistory(day.id,ex.name);
    const bestKg=getBestKg(day.id,ex.name);
    const bestDisplay=bestKg>0?fromKg(bestKg)+" "+unitLabel():"—";
    const allDone=raw.length>0&&raw.every(s=>s.done);
    const anyDone=raw.some(s=>s.done);
    const statusText=allDone?`${raw.length} sets ✓`:anyDone?`${raw.filter(s=>s.done).length}/${raw.length}`:`${ex.sets}×${ex.reps}`;

    const histHTML=hist.length?`<div class="history-section">
      <div class="history-title">Historial</div>
      <div class="history-list">
        ${hist.slice().reverse().map(h=>`
          <div class="history-entry">
            <span class="history-date">${h.date.slice(5)}</span>
            <div class="history-sets">
              ${h.sets.map(s=>{
                const kg=parseFloat(s.kg)||0;
                const isPR=toKg(kg)>=bestKg&&bestKg>0;
                const disp=state.unit==="lbs"?fromKg(toKg(kg)):kg;
                return `<span class="history-set ${isPR?"pr":""}">${disp||"?"}${unitLabel()}×${s.reps||"?"}</span>`;
              }).join("")}
            </div>
          </div>`).join("")}
      </div>
    </div>`:"";

    const setsRows=raw.map((s,si)=>`
      <div class="set-num">${si+1}</div>
      <input class="set-input" type="number" inputmode="decimal" placeholder="0" min="0" step="0.5"
        value="${s.kg}" data-day="${day.id}" data-exname="${ex.name}" data-si="${si}" data-field="kg"
        onchange="updateSet(this)">
      <input class="set-input" type="number" inputmode="numeric" placeholder="${ex.reps}" min="0" step="1"
        value="${s.reps}" data-day="${day.id}" data-exname="${ex.name}" data-si="${si}" data-field="reps"
        onchange="updateSet(this)">
      <button class="set-done-btn ${s.done?"done":""}"
        data-day="${day.id}" data-exname="${ex.name}" data-si="${si}"
        onclick="toggleSetDone(this)">${s.done?"✓":"Listo"}</button>
    `).join("");

    return `<div class="exercise-card" id="ex_${day.id}_${idx}">
      <div class="exercise-header" onclick="toggleExCard('${day.id}',${idx})">
        <div class="ex-num">${idx+1}</div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-status ${allDone?"complete":""}">${statusText}</div>
        <div class="ex-chevron">▼</div>
      </div>
      <div class="exercise-body">
        <div class="sets-grid">
          <div class="sets-label">Set</div>
          <div class="sets-label">${unitLabel()}</div>
          <div class="sets-label">Reps</div>
          <div class="sets-label">✓</div>
          ${setsRows}
        </div>
        <button class="add-set-btn" onclick="addSet('${day.id}','${ex.name}',${idx})">+ Agregar set</button>
        <div class="ex-best">${bestKg>0?`🏆 Mejor: <span class="best-val">${bestDisplay}</span>`:"Primer registro — ¡a romperlo!"}</div>
        <textarea class="ex-notes" placeholder="Notas..."
          data-day="${day.id}" data-exname="${ex.name}"
          onblur="updateNotes(this)">${sess.notes?.[ex.name]||""}</textarea>
        ${histHTML}
      </div>
    </div>`;
  }).join("");

  return `<div class="phase open" id="phase_exercises">
    <div class="phase-header" onclick="togglePhase('exercises')">
      <span class="phase-icon">💪</span><span class="phase-title">Ejercicios</span>
      <span class="phase-chevron">▼</span>
    </div>
    <div class="phase-body" style="padding-bottom:4px;">${cards}</div>
  </div>`;
}

// ══════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════
function setDay(i){state.activeDay=i;saveState();renderDayTabs();renderMain();}
function setUnit(u){state.unit=u;saveState();renderMain();}
function togglePhase(t){const el=document.getElementById("phase_"+t);if(el)el.classList.toggle("open");}
function toggleExCard(dayId,idx){const el=document.getElementById(`ex_${dayId}_${idx}`);if(el)el.classList.toggle("open");}

function toggleWarmup(dayId,type,idx,el){
  const sess=getDaySession(dayId);
  if(!sess[type])sess[type]=[];
  const pos=sess[type].indexOf(idx);
  if(pos===-1){sess[type].push(idx);el.classList.add("done");el.textContent="✓ "+el.textContent.replace("✓ ","");}
  else{sess[type].splice(pos,1);el.classList.remove("done");el.textContent=el.textContent.replace("✓ ","");}
  saveState();
}

function updateSet(input){
  const {day,exname,si,field}=input.dataset;
  const sess=getDaySession(day);
  if(!sess.exercises[exname])sess.exercises[exname]=[];
  if(!sess.exercises[exname][si])sess.exercises[exname][si]={kg:"",reps:"",done:false};
  sess.exercises[exname][si][field]=input.value;
  saveState();
}

function toggleSetDone(btn){
  const {day,exname,si}=btn.dataset;
  const sess=getDaySession(day);
  if(!sess.exercises[exname])sess.exercises[exname]=[];
  if(!sess.exercises[exname][si])sess.exercises[exname][si]={kg:"",reps:"",done:false};
  const grid=btn.closest(".sets-grid");
  if(grid){
    const kg=grid.querySelector(`[data-si="${si}"][data-field="kg"]`);
    const rp=grid.querySelector(`[data-si="${si}"][data-field="reps"]`);
    if(kg)sess.exercises[exname][si].kg=kg.value;
    if(rp)sess.exercises[exname][si].reps=rp.value;
  }
  sess.exercises[exname][si].done=!sess.exercises[exname][si].done;
  saveState();
  btn.classList.toggle("done");
  btn.textContent=sess.exercises[exname][si].done?"✓":"Listo";
  updateExStatus(state.activeDay,day,exname);
  updateProgress();
}

function updateExStatus(dayIdx,dayId,exName){
  const day=DAYS[dayIdx];if(!day)return;
  const exIdx=day.exercises.findIndex(e=>e.name===exName);if(exIdx===-1)return;
  const sess=getDaySession(dayId);
  const sets=sess.exercises[exName]||[];
  const allDone=sets.length>0&&sets.every(s=>s.done);
  const anyDone=sets.some(s=>s.done);
  const badge=document.querySelector(`#ex_${dayId}_${exIdx} .ex-status`);
  if(!badge)return;
  badge.className="ex-status"+(allDone?" complete":"");
  badge.textContent=allDone?`${sets.length} sets ✓`:anyDone?`${sets.filter(s=>s.done).length}/${sets.length}`:`${day.exercises[exIdx].sets}×${day.exercises[exIdx].reps}`;
}

function updateProgress(){
  const day=DAYS[state.activeDay];
  const sess=getDaySession(day.id);
  const done=day.exercises.filter(ex=>(sess.exercises[ex.name]||[]).some(s=>s.done)).length;
  const pct=Math.round(done/day.exercises.length*100);
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progPct").textContent=pct+"%";
}

function addSet(dayId,exName,exIdx){
  const sess=getDaySession(dayId);
  if(!sess.exercises[exName])sess.exercises[exName]=[];
  sess.exercises[exName].push({kg:"",reps:"",done:false});
  saveState();renderMain();
  setTimeout(()=>{const c=document.getElementById(`ex_${dayId}_${exIdx}`);if(c)c.classList.add("open");},40);
}

function updateNotes(ta){
  const {day,exname}=ta.dataset;
  const sess=getDaySession(day);
  if(!sess.notes)sess.notes={};
  sess.notes[exname]=ta.value;
  saveState();
}

function saveSession(){
  const day=DAYS[state.activeDay];
  const sess=getDaySession(day.id);
  const totalDone=day.exercises.reduce((a,ex)=>a+(sess.exercises[ex.name]||[]).filter(s=>s.done).length,0);
  saveState();
  showToast(`✓ ${day.name} guardado — ${totalDone} sets`);
}

// ══════════════════════════════════════════════
//  REPORT
// ══════════════════════════════════════════════
let reportWeekOffset=0; // 0 = current week

function openReport(){
  reportWeekOffset=0;
  buildReport();
  document.getElementById("reportModal").classList.add("open");
}
function closeReport(){document.getElementById("reportModal").classList.remove("open");}
function shiftReportWeek(d){reportWeekOffset+=d;buildReport();}

function getReportMonday(){
  const now=new Date();
  now.setDate(now.getDate()+reportWeekOffset*7);
  const day=now.getDay()||7;
  now.setDate(now.getDate()-day+1);
  return now.toISOString().split("T")[0];
}

function buildReport(){
  const monday=getReportMonday();
  const monDate=new Date(monday+"T12:00:00");
  const friDate=new Date(monDate);friDate.setDate(monDate.getDate()+4);
  const fmt=d=>d.toLocaleDateString("es",{day:"numeric",month:"short"});
  document.getElementById("reportWeekLabel").textContent=`${fmt(monDate)} – ${fmt(friDate)}`;

  // collect sessions for this week
  const weekDates=Array.from({length:5},(_,i)=>{
    const d=new Date(monDate);d.setDate(monDate.getDate()+i);return d.toISOString().split("T")[0];
  });

  let totalDays=0,totalSets=0,totalVolKg=0;
  const dayReports=DAYS.map((day,di)=>{
    const date=weekDates[di];
    const key=`${day.id}_${date}`;
    const sess=state.sessions[key];
    const attended=sess&&Object.values(sess.exercises||{}).some(sets=>sets.some(s=>s.done));
    if(attended)totalDays++;

    const exRows=day.exercises.map(ex=>{
      if(!sess)return null;
      const sets=(sess.exercises[ex.name]||[]).filter(s=>s.done);
      if(!sets.length)return null;
      totalSets+=sets.length;
      sets.forEach(s=>{const kg=parseFloat(s.kg)||0;totalVolKg+=toKg(kg)*(parseInt(s.reps)||0);});
      return {name:ex.name,sets};
    }).filter(Boolean);

    return {day,date,attended,exRows};
  });

  // summary
  document.getElementById("reportSummary").innerHTML=`
    <div class="summary-box"><div class="summary-val">${totalDays}/5</div><div class="summary-lbl">Días</div></div>
    <div class="summary-box"><div class="summary-val">${totalSets}</div><div class="summary-lbl">Sets</div></div>
    <div class="summary-box"><div class="summary-val">${state.unit==="lbs"?Math.round(fromKg(totalVolKg)):Math.round(totalVolKg)}</div><div class="summary-lbl">Vol ${unitLabel()}</div></div>
  `;

  // day rows
  document.getElementById("reportDays").innerHTML=dayReports.map((r,i)=>`
    <div class="report-day" id="rday_${i}">
      <div class="report-day-header" onclick="toggleReportDay(${i})">
        <div class="report-day-dot" style="background:${DAY_HEX[r.day.color]||"#888"}"></div>
        <div class="report-day-name">${r.day.name} <span style="font-weight:400;font-size:.8rem;color:var(--text2)">· ${r.day.muscle}</span></div>
        <div class="report-day-badge ${r.attended?"badge-done":"badge-miss"}">${r.attended?"✓ Hecho":"✗ No hecho"}</div>
      </div>
      <div class="report-day-body">
        ${r.exRows.length?r.exRows.map(ex=>`
          <div class="report-ex-row">
            <div class="report-ex-name">${ex.name}</div>
            <div class="report-sets-wrap">
              ${ex.sets.map(s=>{
                const kg=parseFloat(s.kg)||0;
                const disp=state.unit==="lbs"?fromKg(toKg(kg)):kg;
                return `<span class="report-set-chip">${disp}${unitLabel()} × ${s.reps||"?"}</span>`;
              }).join("")}
            </div>
          </div>`).join("")
        :`<div style="font-size:.78rem;color:var(--text2);padding:6px 0;">Sin registro esta semana.</div>`}
      </div>
    </div>`).join("");

  // auto-open attended days
  dayReports.forEach((r,i)=>{if(r.attended){const el=document.getElementById("rday_"+i);if(el)el.classList.add("open");}});
}

function toggleReportDay(i){
  const el=document.getElementById("rday_"+i);if(el)el.classList.toggle("open");
}

// ══════════════════════════════════════════════
//  EXPORT / IMPORT
// ══════════════════════════════════════════════
function exportJSON(){
  const data={
    exportedAt:new Date().toISOString(),
    unit:state.unit,
    sessions:state.sessions
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const week=getWeekNum();
  a.href=url;a.download=`gym_semana${week}_${todayISO()}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast("JSON exportado ✓");
}

function importJSON(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.sessions){
        state.sessions={...state.sessions,...data.sessions};
        if(data.unit)state.unit=data.unit;
        saveState();renderMain();buildReport();
        showToast("Datos importados ✓");
      }else{showToast("Archivo inválido");}
    }catch(err){showToast("Error al leer JSON");}
  };
  reader.readAsText(file);
  input.value="";
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
loadState();
document.getElementById("weekNum").textContent=getWeekNum();
state.activeDay=todayDayIndex();
renderDayTabs();
renderMain();
</script>
